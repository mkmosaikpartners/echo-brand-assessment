<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Freigabe | ECHO Snapshot</title>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .list { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .item { background: #fff; border-radius: 14px; padding: 16px 20px; display: grid; grid-template-columns: minmax(0, 2fr) 120px 150px auto; gap: 16px; align-items: center; }
  .st { font-weight: 700; }
  .st.review { color: var(--taupe-dark); }
  @media (max-width: 800px) { .item { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/">ECHO SNAPSHOT</a><div class="top-right">Freigabe</div></div></header>
<main class="wrap" style="padding-top:40px;padding-bottom:60px">
  <h1 style="font-size:40px">Ergebnisse</h1>
  <form id="k" style="display:flex;gap:12px;margin-top:18px;max-width:560px">
    <input type="text" name="username" value="echo-admin" autocomplete="username" hidden>
    <input id="key" type="password" placeholder="Passwort" aria-label="Passwort" autocomplete="current-password">
    <button class="btn" type="submit">Anmelden</button>
    <button class="btn ghost" type="button" id="logout" hidden>Abmelden</button>
  </form>
  <div id="out" class="list"></div>
</main>
<script>
  var keyInput = document.getElementById("key");
  var out = document.getElementById("out");
  // Passwort nur im Browser dieses Geräts merken, nie in Links oder Adressen
  var KEY = "echoAdminKey";
  var logoutBtn = document.getElementById("logout");
  function stored() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
  function remember(k) { try { if (k) localStorage.setItem(KEY, k); else localStorage.removeItem(KEY); sessionStorage.removeItem("echoKey"); } catch (e) {} }
  keyInput.value = stored();
  logoutBtn.addEventListener("click", function () { remember(""); keyInput.value = ""; out.innerHTML = ""; logoutBtn.hidden = true; });
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var LABEL = { review: "wartet", done: "sichtbar", error: "Fehler", running: "läuft", queued: "wartet auf Start" };
  function load() {
    var key = keyInput.value.trim();
    remember(key);
    fetch("/api/admin/list", { headers: { "x-admin-key": key } }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) { remember(""); logoutBtn.hidden = true; out.innerHTML = '<div class="error-box">' + esc(j.error) + "</div>"; return; }
      logoutBtn.hidden = false;
      out.innerHTML = j.items.map(function (i) {
        return '<div class="item"><div><b>' + esc(i.company || i.url) + "</b><div class=\"muted\">" + esc(i.url) + (i.pattern ? " · " + esc(i.pattern) : "") + "</div>" +
          (i.name || i.email ? '<div style="margin-top:4px">' + esc(i.name || "") + (i.email ? ' · <a href="mailto:' + esc(i.email) + '">' + esc(i.email) + "</a>" : "") + "</div>" : "") + "</div>" +
          '<div class="st ' + esc(i.status) + '">' + esc(LABEL[i.status] || i.status) + "</div>" +
          '<div class="muted">' + esc(new Date(i.createdAt).toLocaleString("de-CH")) + "</div>" +
          '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost" target="_blank" href="/r/' + esc(i.id) + '">Ansehen</a>' +
          (i.status === "review" ? '<button class="btn" data-id="' + esc(i.id) + '">Freigeben</button>' : "") + "</div></div>";
      }).join("") || '<p class="muted">Noch keine Ergebnisse.</p>';
    });
  }
  document.getElementById("k").addEventListener("submit", function (e) { e.preventDefault(); load(); });
  out.addEventListener("click", function (e) {
    var id = e.target.getAttribute && e.target.getAttribute("data-id");
    if (!id) return;
    fetch("/api/admin/approve/" + id, { method: "POST", headers: { "x-admin-key": keyInput.value.trim() } }).then(load);
  });
  if (keyInput.value) load();
</script>
</body>
</html>
